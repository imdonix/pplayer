# Verifies the code on every push/PR, then builds the Docker image, smoke
# tests it and pushes it to Docker Hub (on pushes to main and version tags).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_USER  Docker Hub username
#   DOCKER_PASS  Docker Hub access token (dckr_pat_...), NOT your password
#
# Optional: create a tag like `v1.2.3` to publish semver tags in addition to
# `latest` and `sha-<commit>`.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Server — install & typecheck
        working-directory: server
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Web — install & build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

  docker:
    name: Build, smoke test & push image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build locally first so the image can be smoke tested before pushing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pplayer:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name pplayer-ci -p 3000:3000 -e API_KEY=ci-test pplayer:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          echo "health: $(curl -fsS http://localhost:3000/api/health)"
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/manifest.webmanifest | grep -q '"pplayer"'
          docker rm -f pplayer-ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USER }}/pplayer
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # For multi-arch (slower: ffmpeg is installed under QEMU), add:
          #   platforms: linux/amd64,linux/arm64
          # and a `docker/setup-qemu-action@v3` step above.
          cache-from: type=gha
